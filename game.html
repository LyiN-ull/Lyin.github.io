<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>VN & DLCs</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body { font-family: sans-serif; background: #111; color: white; }

  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    background: rgba(34, 34, 34, 0.7);
    padding: 15px 30px;
    z-index: 100;
    backdrop-filter: blur(6px);
  }
  nav a {
    color: white;
    text-decoration: none;
    margin-right: 20px;
    font-size: 16px;
  }
  nav a:hover { text-decoration: underline; }

  .hero {
    position: relative;
    height: 100vh;
    width: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  /* 图片层：铺满整个区域，沉到底部 */
.hero .bg {
  position: absolute;
  top: -5%; left: -5%;
  width: 110%;
  height: 110%;
  object-fit: cover;
  z-index: 0;
  filter: blur(8px);
}

  /* 文字层：浮在图片上面，比图片高一层 */
  .hero .content {
    position: relative;
    z-index: 1;
  }

  .hero h1 {
    color: white;
    font-size: 48px;
    font-weight: normal;
    text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    margin-bottom: 10px;
  }

  .hero h2 {
    font-weight: normal;
    margin-top: 20px;
  }
  .hero h2 a {
    color: white;
    text-decoration: none;
    text-shadow: 0 2px 10px rgba(0,0,0,0.9);
  }
  .hero h2 a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

  <nav>
    <a href="/Lyin.github.io/">Home_page</a>
    <a href="/Lyin.github.io/game.html">V.N. & DLCs</a>
    <a href="/Lyin.github.io/about.html">About</a>
  </nav>

 <div class="hero">
  <img class="bg" src="main_menu.png" alt="诶？">
  <div class="content">
    <h1>基于Ren'Py与班级日常制作的视觉小说</h1>
    <h2><a href="https://lyin-ull.itch.io/">---Have a TRY?</a></h2>
  </div>
</div>

  
</body>
</html>
