<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>G.A.T.E</title>
  <style>
    /* ============================================================
    等宽字体，居中布局
       ============================================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Courier New", Consolas, monospace;
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }

    /*image*/
    .image-box {
      max-width: 500px;
      width: 100%;
      margin-bottom: 40px;
    }
    .image-box img {
      width: 100%;
      height: auto;
      display: block;
      border: 1px solid #333;
      border-radius: 4px;
    }

    /* 
       HINT 行
       
         HINT: DOWNLOAD THE .PNG AND [Decode all color channels with LSB]
       */
    .hint {
      font-size: 15px;
      margin-bottom: 30px;
      color: #ccc;
    }

    /* 被遮挡的方括号部分 */
    .redacted {
      display: inline-block;
      background: #fff;
      color: #fff;
      cursor: help;
      padding: 0 4px;
      border-radius: 2px;
      transition: color 0.2s;
    }
    .redacted:hover {
      color: #000;
    }

    /* input */
    .input-line {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
    }
    .input-line span {
      white-space: nowrap;
    }
    .input-line input {
      background: transparent;
      border: none;
      border-bottom: 1px solid #555;
      outline: none;
      color: #fff;
      font-family: inherit;
      font-size: 18px;
      padding: 4px 6px;
      width: 220px;
    }
    .input-line input:focus {
      border-bottom-color: #fff;
    }

    /**/
    #message {
      margin-top: 20px;
      font-size: 14px;
      color: #888;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <!-- ============================================================
       图片
       ============================================================ -->
  <div class="image-box">
    <img src="M82_.png" alt="真的是因为图片加载失败才看到这句话的吗？^^">
  </div>

  <!-- ============================================================
       HINT 行
       ============================================================ -->
  <div class="hint">
    HINT: DOWNLOAD THE .PNG AND
    <span class="redacted">[Decode all color channels with LSB]</span>
  </div>

  <!-- ============================================================
       输入
       ============================================================ -->
  <div class="input-line">
    <span>password:</span>
    <input id="pwd" type="password" autocomplete="off" autofocus>
  </div>

  <div id="message"></div>

  <!-- ============================================================
       JS
       ============================================================ -->
  <script>
    /* 1. 正确密码 */
    const CORRECT_PASSWORD = "Ad Astra Per Aspera";

    /* 2. 密码正确后跳转的目标 */
    const REDIRECT_URL = "/Lyin.github.io/dGVybWluYWw=.html";

    /* 3. 获取元素 */
    const pwdInput = document.getElementById("pwd");
    const message  = document.getElementById("message");

    /* 4. 校验函数 */
    function checkPassword() {
      if (pwdInput.value === CORRECT_PASSWORD) {
        message.textContent = "access granted. loading...";
        window.location.href = REDIRECT_URL;
      } else {
        message.textContent = "[A]ccess [D]enied.";
        pwdInput.value = "";
      }
    }

    /* 5. 监听回车键 */
    pwdInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        checkPassword();
      }
    });

    /* 6. 初始化：聚焦输入框 */
    pwdInput.focus();
  </script>

</body>
</html>
