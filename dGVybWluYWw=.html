<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>dGVybWluYWw=</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Courier New", Consolas, monospace;
      background: #000;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
      font-size: 16px;
      line-height: 1.6;
    }

    #output {
      flex: 1;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    #input-line {
      display: flex;
      align-items: center;
      margin-top: 10px;
    }

    #prompt {
      margin-right: 8px;
      white-space: nowrap;
    }

    #cmd {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: inherit;
      font-size: inherit;
    }

    #output::-webkit-scrollbar { width: 8px; }
    #output::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
  </style>
</head>
<body>

  <div id="output"></div>

  <div id="input-line">
    <span id="prompt">visitor:~$</span>
    <input id="cmd" type="text" autocomplete="off" autofocus>
  </div>

  <script>
    /* ============================================================
       虚拟文件系统
       ============================================================ */
    const fileSystem = {
      "/": {
        type: "dir",
        children: ["新建文件夹1", "新建文件夹2"]
      },
      "/新建文件夹1": {
        type: "dir",
        children: ["001"]
      },
      "/新建文件夹1/001": {
        type: "dir",
        children: ["null.txt"]
      },
      "/新建文件夹1/001/null.txt": {
        type: "file",
        content: "这不应该是个空文件吗（不是）"
      },
      "/新建文件夹2": {
        type: "dir",
        children: ["003", "004"]
      },
      "/新建文件夹2/003": {
        type: "file",
        content: "没什么东西，你要是无聊可以去itch上面找小游戏玩。",
        link: "https://itch.io"
      },
      "/新建文件夹2/004": {
        type: "file",
        content: "uhhh......你要是点这个链接会404因为我没写好",
        link: "/null.github.io/null.html"
      }
    };

    /* ============================================================
       2. 当前路径
       ============================================================ */
    let cwd = "/";

    /* ============================================================
       3. 获取元素引用
       ============================================================ */
    const output = document.getElementById("output");
    const input  = document.getElementById("cmd");
    const prompt = document.getElementById("prompt");

    /* ============================================================
       4. 输出到终端
       ============================================================ */
    function print(text) {
      const line = document.createElement("div");
      line.textContent = text;
      output.appendChild(line);
      output.scrollTop = output.scrollHeight;
    }

    /* ============================================================
       5. 更新提示符
       ============================================================ */
    function updatePrompt() {
      prompt.textContent = "visitor:" + cwd + "$";
    }

    /* ============================================================
       6. 解析路径
       ============================================================ */
    function resolvePath(target) {
      if (!target) return cwd;
      if (target.startsWith("/")) return target;

      const parts = (cwd === "/" ? [] : cwd.split("/").filter(Boolean));
      target.split("/").forEach(seg => {
        if (seg === "" || seg === ".") return;
        if (seg === "..") parts.pop();
        else parts.push(seg);
      });
      return "/" + parts.join("/");
    }

    /* ============================================================
       7. 命令表
       ============================================================ */
    const commands = {

      help() {
        print("可用命令：");
        print("  ls              列出当前目录内容");
        print("  cd <目录>       进入目录，cd .. 返回上级");
        print("  pwd             显示当前路径");
        print("  cat <文件>      查看文件内容");
        print("  open <名称>     打开文件对应的网页");
        print("  clear           清屏，字面意思");
        print("  exit            返回博客首页");
      },

      ls() {
        const node = fileSystem[cwd];
        if (!node || node.type !== "dir") {
          print("ls: 当前路径不是一个目录");
          return;
        }
        node.children.forEach(name => {
          const childPath = (cwd === "/" ? "" : cwd) + "/" + name;
          const child = fileSystem[childPath];
          const suffix = child && child.type === "dir" ? "/" : "";
          print("  " + name + suffix);
        });
      },

      cd(args) {
        const target = args[0];
        if (!target) { print("cd: 缺少参数"); return; }
        const path = resolvePath(target);

        if (!fileSystem[path]) { print("cd: 没有这个目录: " + target); return; }
        if (fileSystem[path].type !== "dir") { print("cd: 不是目录: " + target); return; }

        cwd = path === "" ? "/" : path;
        updatePrompt();
      },

      pwd() {
        print(cwd);
      },

      cat(args) {
        const target = args[0];
        if (!target) { print("cat: 缺少参数"); return; }

        const path = resolvePath(target);
        const node = fileSystem[path];
        if (!node) { print("cat: 找不到文件: " + target); return; }
        if (node.type !== "file") { print("cat: 不是文件: " + target); return; }

        print(node.content);
      },

      open(args) {
        const target = args[0];
        if (!target) { print("open: 缺少参数"); return; }

        const path = resolvePath(target);
        const node = fileSystem[path];
        if (!node) { print("open: 找不到: " + target); return; }
        if (!node.link) { print("open: 这个文件没有可打开的链接"); return; }

        print("正在打开 " + target + " ...");
        window.location.href = node.link;
      },

      clear() {
        output.innerHTML = "";
      },

      exit() {
        print("正在离开终端 ...");
        window.location.href = "/Lyin.github.io/";
      }
    };

    /* ============================================================
       8. 处理每一行命令
       ============================================================ */
    function handleCommand(raw) {
      const line = raw.trim();
      if (line === "") return;

      print(prompt.textContent + " " + line);

      const parts = line.split(/\s+/);
      const cmd = parts[0];
      const args = parts.slice(1);

      if (commands[cmd]) {
        commands[cmd](args);
      } else {
        print("command not found: " + cmd + "（输入 help 查看可用命令）");
      }
    }

    /* ============================================================
        监听回车键
       ============================================================ */
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        handleCommand(input.value);
        input.value = "";
      }
    });

    /* ============================================================
       10. 点击页面任意位置，聚焦输入框
       ============================================================ */
    document.addEventListener("click", function () {
      input.focus();
    });

    /* ============================================================
       11. 初始化 可以可以
       ============================================================ */
    updatePrompt();
    print("Welcome to the terminal. Type 'help' to see commands.^^");
    input.focus();
  </script>

</body>
</html>
