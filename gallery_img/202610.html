<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>2026.10</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: sans-serif;
      background: #111;
      color: white;
      padding: 100px 40px 60px;
    }
    nav {
      position: fixed; top: 0; left: 0; right: 0;
      background: rgba(34, 34, 34, 0.7);
      padding: 15px 30px; z-index: 100;
      backdrop-filter: blur(6px);
    }
    nav a {
      color: white; text-decoration: none; margin-right: 20px; font-size: 16px;
    }
    nav a:hover { text-decoration: underline; }

    h1 { font-weight: normal; font-size: 48px; text-align: center; margin-bottom: 20px; }
    
    .back-link {
      display: block; text-align: center; color: #888; text-decoration: none;
      margin-bottom: 50px; font-size: 16px;
    }
    .back-link:hover { color: white; }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .gallery-item {
      position: relative; overflow: hidden; border-radius: 8px;
      background: #222; cursor: pointer; aspect-ratio: 4 / 3;
    }
    .gallery-item img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform 0.4s ease, opacity 0.4s ease;
    }
    .gallery-item:hover img { transform: scale(1.05); opacity: 0.3; }

    .gallery-caption {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 80%; text-align: center; color: white; font-size: 18px;
      line-height: 1.6; opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
    }
    .gallery-item:hover .gallery-caption { opacity: 1; }

    .lightbox {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.9); z-index: 999; justify-content: center;
      align-items: center; cursor: zoom-out;
    }
    .lightbox.active { display: flex; }
    .lightbox img {
      max-width: 90%; max-height: 90vh; object-fit: contain;
      box-shadow: 0 0 30px rgba(0,0,0,0.8); animation: zoomIn 0.3s ease;
    }
    @keyframes zoomIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>

  <nav>
    <a href="/Lyin.github.io/">Home_page</a>
    <a href="/Lyin.github.io/game.html">V.N. & DLCs</a>
    <a href="/Lyin.github.io/gallery.html">Gallery</a>
    <a href="/Lyin.github.io/about.html">About</a>
  </nav>

  <div class="lightbox" id="lightbox">
    <img id="lightbox-img" src="" alt="全屏查看">
  </div>

  <script>
    const items = document.querySelectorAll('.gallery-item');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    items.forEach(item => {
      item.addEventListener('click', () => {
        lightboxImg.src = item.getAttribute('data-full');
        lightbox.classList.add('active');
      });
    });

    lightbox.addEventListener('click', () => {
      lightbox.classList.remove('active');
      lightboxImg.src = "";
    });
  </script>
</body>
</html>
