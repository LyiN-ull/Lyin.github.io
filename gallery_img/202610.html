<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>2026.10</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: sans-serif;
      background: #111;
      color: white;
      padding: 100px 40px 60px;
    }
    nav {
      position: fixed; top: 0; left: 0; right: 0;
      background: rgba(34, 34, 34, 0.7);
      padding: 15px 30px; z-index: 100;
      backdrop-filter: blur(6px);
    }
    nav a {
      color: white; text-decoration: none; margin-right: 20px; font-size: 16px;
    }
    nav a:hover { text-decoration: underline; }

    h1 { font-weight: normal; font-size: 48px; text-align: center; margin-bottom: 20px; }
    
    .back-link {
      display: block; text-align: center; color: #888; text-decoration: none;
      margin-bottom: 50px; font-size: 16px;
    }
    .back-link:hover { color: white; }

    /* ============================================================
       1. 瀑布流排版（保留原图比例，自适应视窗）
       ============================================================ */
    .gallery-grid {
      column-count: 3;      /* 默认分 3 列 */
      column-gap: 20px;     /* 列间距 */
      max-width: 1200px;
      margin: 0 auto;
    }

    /* 响应式：当屏幕变窄时，列数自动减少 */
    @media (max-width: 900px) {
      .gallery-grid { column-count: 2; }
    }
    @media (max-width: 600px) {
      .gallery-grid { column-count: 1; }
    }

    /* 卡片样式 */
    .gallery-item {
      position: relative; 
      overflow: hidden; 
      border-radius: 8px;
      background: #222; 
      cursor: pointer; 
      margin-bottom: 20px;  /* 图片之间的上下间距 */
      break-inside: avoid;  /* 防止图片在瀑布流中被拦腰截断 */
    }

    /* ============================================================
       2. 小图虚化 + 原比例
       ============================================================ */
    .gallery-item img {
      width: 100%;
      height: auto;         /* 高度自动，保持原图比例 */
      display: block;
      filter: blur(4px);    /* 默认虚化 */
      transform: scale(1.02); /* 稍微放大一点点，防止边缘因为虚化出现白边 */
      transition: filter 0.3s ease, transform 0.3s ease;
    }

    /* 鼠标悬停：取消虚化，恢复原大小 */
    .gallery-item:hover img { 
      filter: blur(0px); 
      transform: scale(1);
    }

    /* ============================================================
       3. 悬停显示的批注
       ============================================================ */
    .gallery-caption {
      position: absolute; 
      top: 50%; left: 50%; 
      transform: translate(-50%, -50%);
      width: 90%; 
      text-align: center; 
      color: white; 
      font-size: 18px;
      line-height: 1.6; 
      opacity: 0; 
      transition: opacity 0.3s ease; 
      pointer-events: none;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9), 0 0 20px rgba(0,0,0,1);
      background: rgba(0,0,0,0.4); /* 给文字加个半透明黑底，看得更清 */
      padding: 15px;
      border-radius: 8px;
    }
    .gallery-item:hover .gallery-caption { opacity: 1; }

    /* ============================================================
       4. Lightbox 大图（清晰）
       ============================================================ */
    .lightbox {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.9); z-index: 999; justify-content: center;
      align-items: center; cursor: zoom-out;
    }
    .lightbox.active { display: flex; }
    
    .lightbox img {
      max-width: 95%; 
      max-height: 95vh; 
      object-fit: contain; 
      box-shadow: 0 0 30px rgba(0,0,0,0.8); 
      animation: zoomIn 0.3s ease;
      /* 大图绝对不带虚化 */
      filter: none; 
    }
    @keyframes zoomIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>

  <div class="lightbox" id="lightbox">
    <img id="lightbox-img" src="" alt="全屏查看">
  </div>

  <script>
    const items = document.querySelectorAll('.gallery-item');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    items.forEach(item => {
      item.addEventListener('click', () => {
        lightboxImg.src = item.getAttribute('data-full');
        lightbox.classList.add('active');
      });
    });

    lightbox.addEventListener('click', () => {
      lightbox.classList.remove('active');
      lightboxImg.src = "";
    });
  </script>
