<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Gallery 2026.10</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: sans-serif;
      background: #111;
      color: white;
      padding: 100px 40px 60px;
    }

    /* 顶部导航栏 */
    nav {
      position: fixed; top: 0; left: 0; right: 0;
      background: rgba(34, 34, 34, 0.7);
      padding: 15px 30px; z-index: 100;
      backdrop-filter: blur(6px);
    }
    nav a {
      color: white; text-decoration: none; margin-right: 20px; font-size: 16px;
    }
    nav a:hover { text-decoration: underline; }

    h1 { font-weight: normal; font-size: 48px; text-align: center; margin-bottom: 20px; }
    
    .back-link {
      display: block; text-align: center; color: #888; text-decoration: none;
      margin-bottom: 50px; font-size: 16px;
    }
    .back-link:hover { color: white; }

    /* ============================================================
       自适应等高网格布局（完美解决长图撑爆页面问题）
       ============================================================ */
    .gallery-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
      justify-content: center;
    }

    .gallery-item {
      position: relative; 
      overflow: hidden; 
      border-radius: 8px;
      background: #222; 
      cursor: pointer; 
      height: 300px; /* 所有图片统一高度，想改大改小改这里 */
      flex-grow: 1;  /* 自动填满剩余空间 */
    }

    /* 图片样式 */
    .gallery-item img {
      height: 100%;
      width: auto;
      object-fit: contain; /* 保证图片完整显示，绝不裁剪 */
      display: block;
      filter: blur(4px);   /* 默认虚化 */
      transition: filter 0.3s ease, transform 0.3s ease;
    }

    /* 悬停：取消虚化 */
    .gallery-item:hover img { 
      filter: blur(0px); 
    }

    /* ============================================================
       悬停显示的批注文字
       ============================================================ */
    .gallery-caption {
      position: absolute; 
      top: 50%; left: 50%; 
      transform: translate(-50%, -50%);
      width: 90%; 
      text-align: center; 
      color: white; 
      font-size: 18px;
      line-height: 1.6; 
      opacity: 0; 
      transition: opacity 0.3s ease; 
      pointer-events: none;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9), 0 0 20px rgba(0,0,0,1);
      background: rgba(0,0,0,0.4); /* 文字半透明黑底 */
      padding: 15px;
      border-radius: 8px;
    }
    .gallery-item:hover .gallery-caption { opacity: 1; }

    /* ============================================================
       Lightbox 全屏大图（原图无虚化）
       ============================================================ */
    .lightbox {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.9); z-index: 999; justify-content: center;
      align-items: center; cursor: zoom-out;
    }
    .lightbox.active { display: flex; }
    
    .lightbox img {
      max-width: 95%; 
      max-height: 95vh; 
      object-fit: contain; 
      box-shadow: 0 0 30px rgba(0,0,0,0.8); 
      animation: zoomIn 0.3s ease;
      filter: none;
    }
    @keyframes zoomIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>

  <nav>
    <a href="/Lyin.github.io/">Home_page</a>
    <a href="/Lyin.github.io/game.html">V.N. & DLCs</a>
    <a href="/Lyin.github.io/gallery.html">Gallery</a>

  <!-- Lightbox 全屏大图容器 -->
  <div class="lightbox" id="lightbox">
    <img id="lightbox-img" src="" alt="全屏查看">
  </div>

  <script>
    const items = document.querySelectorAll('.gallery-item');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    items.forEach(item => {
      item.addEventListener('click', () => {
        lightboxImg.src = item.getAttribute('data-full');
        lightbox.classList.add('active');
      });
    });

    lightbox.addEventListener('click', () => {
      lightbox.classList.remove('active');
      lightboxImg.src = "";
    });
  </script>
</body>
</html>
