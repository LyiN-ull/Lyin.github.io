<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>tks_for_noticing_the_title</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: sans-serif;
      overflow: hidden;
      background: #111;
      color: white;
    }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: rgba(34, 34, 34, 0.7);
      padding: 15px 30px;
      z-index: 100;
      backdrop-filter: blur(6px);
    }
    nav a {
      color: white;
      text-decoration: none;
      margin-right: 20px;
      font-size: 16px;
    }
    nav a:hover { text-decoration: underline; }

 /* 上面一层：全屏首页 */
    .hero {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 50;
      transition: transform 1s ease;
    }

   .hero.slide-up {
      transform: translateY(-100%);
    }

    .hero .bg {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .hero .content {
      position: relative;
      z-index: 1;
    }

    .hero h1 {
      position: relative;
      color: white;
      font-size: 64px;
      font-weight: normal;
      text-shadow: 0 4px 20px rgba(0,0,0,0.7);
      opacity: 0;
      animation: fadeIn 2.5s ease 0.5s forwards;
    }
 /* 向下箭头 */
    .arrow {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      font-size: 40px;
      color: white;
      cursor: pointer;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
      animation: bounce 2s infinite;
      user-select: none;
     }
   @keyframes bounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50%      { transform: translateX(-50%) translateY(12px); }
   }
  /* 下面一层：导航页 */
    .panel {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100vh;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 40;
    }

    .panel a {
      display: block;
      color: white;
      text-decoration: none;
      font-size: 32px;
      margin: 20px 0;
      transition: opacity 0.3s;
    }
    .panel a:hover { opacity: 0.6; }
  </style>
</head>
<body>

  <nav>
    <a href="/Lyin.github.io/">Home_page</a>
    <a href="/Lyin.github.io/game.html">V.N. & DLCs</a>
    <a href="/Lyin.github.io/about.html">About</a>
  </nav>
 <!-- 上面一层：首页 -->
  <div class="hero" id="hero">
    <img class="bg" src="ALIS.jpg" alt="看到这句话就和我说网站出问题了。">
    <div class="content">
      <h1>Home_page</h1>
    </div>
    <div class="arrow" onclick="slideUp()">↓</div>
  </div>

  <!-- 下面一层：导航 -->
  <div class="panel">
    <a href="/Lyin.github.io/game.html">About10H8 & DLCs</a>
    <a href="/Lyin.github.io/about.html">About</a>
  </div>

  
  <script>
    function slideUp() {
      document.getElementById('hero').classList.add('slide-up');
    }
  </script>
  
</body>
</html>
