<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Entries</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Courier New", Consolas, monospace;
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .terminal {
      width: 100%;
      max-width: 720px;
      background: #0a0a0a;
      border: 1px solid #333;
      border-radius: 6px;
      box-shadow: 0 0 30px rgba(0, 255, 0, 0.08);
      overflow: hidden;
    }

    .term-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .dot.red    { background: #ff5f56; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green  { background: #27c93f; }
    .term-title {
      margin-left: 10px;
      font-size: 13px;
      color: #888;
    }

    .term-body {
      padding: 30px 26px 40px;
      font-size: 17px;
      line-height: 1.9;
    }

    .prompt {
      color: #4ade80;   /* 终端绿，只用于提示符 */
    }

    .cmd {
      color: #fff;
    }

    .cursor {
      display: inline-block;
      width: 9px;
      height: 18px;
      background: #fff;
      vertical-align: -3px;
      margin-left: 4px;
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }

    .links {
      margin-top: 22px;
    }
    .links a {
      display: block;
      color: #fff;
      text-decoration: none;
      padding: 6px 0;
      transition: color 0.2s, padding-left 0.2s;
    }
    .links a::before {
      content: "> ";
      color: #4ade80;
    }
    .links a:hover {
      color: #4ade80;
      padding-left: 8px;
    }

    /* 顶部导航，保持之前风格 */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: rgba(0, 0, 0, 0.75);
      padding: 15px 30px;
      z-index: 100;
      backdrop-filter: blur(6px);
      font-family: sans-serif;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin-right: 20px;
      font-size: 16px;
    }
    nav a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <nav>
    <a href="/Lyin.github.io/">Home_page</a>
    <a href="/Lyin.github.io/game.html">V.N. & DLCs</a>
    <a href="/Lyin.github.io/about.html">About</a>
  </nav>

  <div class="terminal">
    <div class="term-bar">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <span class="term-title">entries — bash</span>
    </div>

    <div class="term-body">
      <div>
        <span class="prompt">lyin@blog:~$</span>
        <span class="cmd"> ls entries/</span>
      </div>

      <div class="links">
        <a href="https://你的第一个网站" target="_blank">Entry 01</a>
        <a href="https://你的第二个网站" target="_blank">Entry 02</a>
        <a href="https://你的第三个网站" target="_blank">Entry 03</a>
      </div>

      <div style="margin-top: 22px;">
        <span class="prompt">lyin@blog:~$</span>
        <span class="cursor"></span>
      </div>
    </div>
  </div>

</body>
</html>
